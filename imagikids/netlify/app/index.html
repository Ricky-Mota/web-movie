<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>window.IK_HOSTED = true;</script>
<title>ImagiKids</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Concept : le cahier d'écolier à lignes Seyès (thème clair) et l'ardoise (thème sombre).
   Une couleur par matière : lettres = corail, chiffres = ciel, monde = feuille. */
:root{
  --paper:#f5f8fd; --seyes:#dbe6f6; --seyes-strong:#c3d4ee; --margin:#f0a9b6;
  --ink:#1c2643; --muted:#566384; --card:#ffffff; --line:#d5deec;
  --sun:#f4ad1d; --sun-soft:#fff3d6; --coral:#e2533f; --coral-soft:#fde6e1;
  --sky:#2a76d2; --sky-soft:#e1eefc; --leaf:#22925f; --leaf-soft:#ddf3e7;
  --plum:#7449c9; --plum-soft:#ece5fb; --ok:#1f8f55; --err:#c83a25; --pointer:#ff6a13;
  --f-display:"Grandstander","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17202b; --seyes:#1d2834; --seyes-strong:#223040; --margin:#5a3341;
  --ink:#eef2f8; --muted:#a2aec3; --card:#1f2a37; --line:#2e3b4c;
  --sun:#ffc54d; --sun-soft:#3a3018; --coral:#ff7f6c; --coral-soft:#3e2420; --sky:#6eabf2; --sky-soft:#1c2d45;
  --leaf:#4fcb92; --leaf-soft:#173528; --plum:#ab8cf2; --plum-soft:#2b2445; --ok:#4fcb92; --err:#ff7f6c; --pointer:#ff8a3d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17202b; --seyes:#1d2834; --seyes-strong:#223040; --margin:#5a3341;
  --ink:#eef2f8; --muted:#a2aec3; --card:#1f2a37; --line:#2e3b4c;
  --sun:#ffc54d; --sun-soft:#3a3018; --coral:#ff7f6c; --coral-soft:#3e2420; --sky:#6eabf2; --sky-soft:#1c2d45;
  --leaf:#4fcb92; --leaf-soft:#173528; --plum:#ab8cf2; --plum-soft:#2b2445; --ok:#4fcb92; --err:#ff7f6c; --pointer:#ff8a3d;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--seyes-strong) 1px,transparent 1px),linear-gradient(var(--seyes) 1px,transparent 1px);
  background-size:100% 32px,100% 8px}
.wrap{max-width:1120px;margin:0 auto;padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,58px);font-weight:800}
h2{font-size:clamp(24px,3.4vw,32px);font-weight:800}
h3{font-size:20px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pointer);outline-offset:3px}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:10px 18px;font-weight:600;display:inline-flex;align-items:center;gap:8px;box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--sky);border-color:var(--sky);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--sky) 60%,#000)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#1c2643;box-shadow:0 3px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.btn.ghost{border-color:var(--line);box-shadow:none}
.btn.danger{color:var(--err);border-color:var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* barre du haut */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-weight:800;font-size:26px;display:flex;align-items:center;gap:8px;border:0;background:none;padding:0}
.logo .dot{width:34px;height:34px;border-radius:10px;background:var(--sun);display:grid;place-items:center;font-size:20px;transform:rotate(-6deg)}
.logo b{color:var(--sky)}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--sun-soft);color:var(--ink);border:1px dashed var(--sun)}
.badge.on{background:var(--leaf-soft);border-color:var(--leaf)}
/* accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero p.lead{font-size:19px;max-width:34em;margin-top:14px}
.hero h1 em{font-style:normal;color:var(--coral);position:relative}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:8px;border-radius:8px;background:var(--sun);opacity:.55;z-index:-1}
.demo-card{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:20px;box-shadow:6px 6px 0 var(--sky);display:grid;gap:14px;position:relative}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid4,.grid3{grid-template-columns:minmax(0,1fr)}}
.level{border-radius:18px;padding:18px;display:grid;gap:6px;border:2px solid transparent;align-content:start}
.level .ico{font-size:34px}
.level .age{font-weight:600;font-size:14px}
.lv-eveil{background:var(--sun-soft);border-color:var(--sun)}
.lv-decouverte{background:var(--coral-soft);border-color:var(--coral)}
.lv-explorateur{background:var(--sky-soft);border-color:var(--sky)}
.lv-expert{background:var(--plum-soft);border-color:var(--plum)}
.subj{border-radius:18px;padding:18px;background:var(--card);border:1px solid var(--line);display:grid;gap:8px;border-top:6px solid var(--c)}
.subj ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.safe{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px;margin:12px 0 0;padding:0;list-style:none}
@media (max-width:640px){.safe{grid-template-columns:minmax(0,1fr)}}
.safe li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.safe li b{display:block}
.check{width:24px;height:24px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.offer{border-radius:18px;padding:20px;background:var(--card);border:1px solid var(--line);display:grid;gap:10px;align-content:start}
.offer.feat{border:2px solid var(--sky)}
.price{font-family:var(--f-display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.price small{font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--muted)}
.offer ul{margin:0;padding-left:18px;font-size:15px}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
/* formulaires */
.form{display:grid;gap:14px;max-width:460px}
label.f{display:grid;gap:5px;font-weight:600;font-size:14px}
.inp{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;width:100%}
.inp:focus{border-color:var(--sky);outline:none}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--sky);color:#fff}
.note{font-size:14px;border-radius:12px;padding:10px 14px;background:var(--sun-soft);border:1px solid var(--sun)}
.note.err{background:var(--coral-soft);border-color:var(--coral)}
.note.ok{background:var(--leaf-soft);border-color:var(--leaf)}
.avatars{display:flex;flex-wrap:wrap;gap:8px}
.avatars button{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:28px}
.avatars button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
/* tableau de bord */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.kid{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px;align-content:start}
.kid .head{display:flex;gap:12px;align-items:center}
.kid .av{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:34px;background:var(--paper);border:1px solid var(--line);flex:none}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:20px;border:1px solid}
.chip.eveil{background:var(--sun-soft);border-color:var(--sun)}
.chip.decouverte{background:var(--coral-soft);border-color:var(--coral)}
.chip.explorateur{background:var(--sky-soft);border-color:var(--sky)}
.chip.expert{background:var(--plum-soft);border-color:var(--plum)}
.bars{display:grid;gap:8px}
.bars .b{display:grid;grid-template-columns:118px 1fr 56px;gap:8px;align-items:center;font-size:14px}
.track{height:10px;border-radius:10px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--c);border-radius:10px}
.bars .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;font-size:13px;display:grid;gap:4px}
.hist li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.hist li span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.stats{display:flex;gap:18px;font-size:14px}
.stats b{font-family:var(--f-display);font-size:22px;display:block;font-variant-numeric:tabular-nums}
/* espace enfant */
.kidhome{display:grid;gap:22px;justify-items:center;text-align:center}
.bigav{font-size:72px;width:120px;height:120px;border-radius:32px;display:grid;place-items:center;background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--sun)}
.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%}
@media (max-width:700px){.subjects{grid-template-columns:minmax(0,1fr)}}
.sbtn{border:3px solid var(--c);background:var(--card);border-radius:24px;padding:22px 14px;display:grid;gap:8px;justify-items:center;box-shadow:0 6px 0 var(--c);transition:transform .1s}
.sbtn:active{transform:translateY(4px)}
.sbtn .e{font-size:54px;line-height:1}
.sbtn b{font-family:var(--f-display);font-size:22px}
.stars{font-size:20px;letter-spacing:2px}
.stars .off{opacity:.25}
/* activité */
.act{display:grid;gap:16px;position:relative}
.act-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.dots i.ok{background:var(--ok);border-color:var(--ok)}
.dots i.ko{background:var(--sun);border-color:var(--sun)}
.dots i.cur{border-color:var(--pointer);transform:scale(1.2)}
.qcard{background:var(--card);border:2px solid var(--ink);border-radius:24px;padding:20px;display:grid;gap:14px;justify-items:center;text-align:center;box-shadow:5px 5px 0 var(--c)}
.qtext{font-family:var(--f-display);font-size:clamp(22px,3.6vw,32px);font-weight:600;max-width:24em}
.visual{font-size:clamp(40px,8vw,64px);line-height:1.2;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}
.visual .gone{position:relative;opacity:.35}
.visual .gone::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:var(--err);font-size:.8em;font-weight:700}
.visual .op{font-family:var(--f-display);font-weight:800;color:var(--muted);align-self:center;font-size:.8em}
.sentence{font-size:clamp(20px,3vw,26px);font-family:var(--f-body)}
.sentence mark{background:var(--sun-soft);color:var(--ink);border-bottom:3px solid var(--sun);padding:0 4px;border-radius:4px}
.mgrid{display:grid;gap:5px;justify-content:center}
.mgrid i{width:14px;height:14px;border-radius:50%;background:var(--sky)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative}
.opt{border:3px solid var(--line);background:var(--card);border-radius:22px;padding:16px 8px;min-height:120px;display:grid;gap:6px;justify-items:center;align-content:center;font-weight:600;font-size:18px;transition:transform .12s,border-color .12s}
.opt:hover{border-color:var(--c)}
.opt .im{font-size:clamp(44px,8vw,64px);line-height:1}
.opt .big{font-family:var(--f-display);font-size:clamp(34px,6vw,50px);font-weight:800;line-height:1}
.opt svg{width:clamp(56px,10vw,84px);height:auto}
.opt.good{border-color:var(--ok);background:var(--leaf-soft)}
.opt.bad{border-color:var(--err);animation:shake .35s}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:1.6em;font-weight:600;text-align:center;font-size:18px}
.feedback.ok{color:var(--ok)} .feedback.err{color:var(--err)}
.pointer{position:absolute;width:56px;height:56px;pointer-events:none;z-index:5;transition:left .4s,top .4s}
.pointer svg{width:100%;height:100%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(8px)}}
.endcard{display:grid;gap:14px;justify-items:center;text-align:center;padding:30px 20px}
.endcard .stars{font-size:54px}
.endcard .score{font-family:var(--f-display);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* niveaux 1 à 5, volume, grille des matières */
.subjects{grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr))!important}
.sbtn{padding:18px 12px}
.sbtn .e{font-size:44px}
.sbtn b{font-size:19px}
.lvl-tag{font-size:13px;font-weight:600;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;width:100%}
@media (max-width:640px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step{border:3px solid var(--c);background:var(--card);border-radius:20px;padding:16px 8px;display:grid;gap:6px;justify-items:center;box-shadow:0 5px 0 var(--c)}
.step b{font-family:var(--f-display);font-size:34px;line-height:1}
.step.locked{border-color:var(--line);box-shadow:none;opacity:.6;cursor:not-allowed}
.vol{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 10px}
.vol input{width:92px;accent-color:var(--sky)}
.subjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:12px}
.subjgrid article,.subjgrid .subjcard{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:14px;display:grid;gap:4px;align-content:start}
.subjgrid h3{font-size:18px}
.subjgrid p{font-size:14px;color:var(--muted)}
.subjgrid .from{font-size:12px;font-weight:600}
.chrono{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.bars .b{grid-template-columns:minmax(0,1fr) 90px 64px}
.paliers{display:grid;gap:16px;width:100%}
.palier{display:grid;gap:8px;text-align:left}
.palier-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:15px;border-bottom:2px dashed var(--line);padding-bottom:4px}
.palier-h span{color:var(--muted);font-size:14px}
.paliers .steps{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.paliers .steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step.chal{background:var(--sun-soft)}
.hw-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.hw textarea{resize:vertical;font-family:var(--f-body)}
.hw-mode{border:0;margin:0;padding:0;display:grid;gap:6px;font-size:15px}
.hw-mode label{display:flex;gap:8px;align-items:flex-start}
.hw-out{display:grid;gap:8px;line-height:1.6}
.hw-out h3{font-size:19px;margin-top:10px;color:var(--sky)}
.hw-out h3:first-child{margin-top:0}
.hw-out ol,.hw-out ul{margin:0;padding-left:22px;display:grid;gap:4px}
.hw-out code{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:0 4px}
.hw-promo{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;border:2px solid var(--sun)}
.calc-steps{margin:0;padding-left:22px;display:grid;gap:4px}
.calc-res{font-size:20px}
.langsel{border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink);padding:2px;max-width:130px}
[dir="rtl"] .opts,[dir="rtl"] .visual{direction:ltr}
[dir="rtl"] .bars .n{text-align:left}

/* ===== Adaptation à tous les écrans ===== */
.opts.long{grid-template-columns:minmax(0,1fr)}
.opts.long .opt{min-height:0;grid-auto-flow:column;justify-content:start;justify-items:start;text-align:start;padding:14px 16px;gap:12px}
.opts.long .opt .im{font-size:34px}
.opts.long .opt .big{font-size:clamp(17px,2.6vw,22px)!important;line-height:1.3}
.opt{overflow-wrap:anywhere;hyphens:auto}
img,svg{max-width:100%}
@media (min-width:700px){.opts.long{grid-template-columns:repeat(3,minmax(0,1fr))}.opts.long .opt{grid-auto-flow:row;justify-items:center;justify-content:center;text-align:center;min-height:110px}}
/* petits téléphones */
@media (max-width:560px){
  .top{gap:8px}
  #lang-lbl,#vol-lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .vol{padding:4px 8px}
  .vol input{width:72px}
  .langsel{max-width:104px}
  #nav .btn{padding:8px 12px;font-size:14px}
  .act-top .btn{padding:7px 10px;font-size:14px}
  .qcard{padding:16px 12px}
  .opts{gap:10px}
  .opt{min-height:100px;padding:12px 6px;border-radius:18px}
  .stats{gap:12px}
  .bars .b{grid-template-columns:minmax(0,1fr) 70px 46px;font-size:13px}
  .hist li{flex-direction:column;gap:0}
  .bigav{width:96px;height:96px;font-size:56px}
}
@media (max-width:360px){
  .wrap{gap:20px}
  .logo{font-size:22px}
  .opt .im{font-size:40px}
  .steps,.paliers .steps{gap:8px}
  .step{padding:12px 4px}
  .step b{font-size:28px}
}
/* téléphone à l'horizontale et écrans peu hauts */
@media (max-height:520px) and (orientation:landscape){
  .wrap{gap:14px;padding-block:8px 24px}
  .qcard{padding:10px 14px;gap:6px;box-shadow:3px 3px 0 var(--c)}
  .qtext{font-size:20px}
  .visual{font-size:36px}
  .opt{min-height:72px;padding:8px}
  .opt .im{font-size:34px}
  .opt .big{font-size:28px}
  .act{gap:10px}
  .bigav{width:72px;height:72px;font-size:40px;border-radius:20px}
  .kidhome{gap:12px}

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

  const s = new Set([ans]);

}
const numQ = (q, say, ans, cands, ex, visual, unit = "") => ({q, say, visual,
  opts:shuffle(distinctNums(ans, cands)).map(k => opt(fr(k) + unit, {big:fr(k) + unit, small:unit.length > 0 || k >= 10000, good:k === ans})), ex});
/* question de banque : [niveau, question, image, [[img, réponse juste], [img, faux], ...], explication] */
const bankQ = ([, q, v, o, ex]) => ({q, say:q, visual:v ? `<span>${v}</span>` : null, opts:shuffle(o.map((x, i) => opt(x[1], {img:x[0] || null, good:i === 0}))), ex});
function fromBank(bank, s, n = 5){
  let pool = bank.filter(x => x[0] === s), d = 1;
  while (pool.length < n && d < 5){ pool = pool.concat(pick(bank.filter(x => Math.abs(x[0] - s) === d), n - pool.length)); d++; }

}
let BOOST = 0; /* 0 à 3 : difficulté à l'intérieur d'un palier (niveaux 1-20) */
const AGES = ["eveil","decouverte","explorateur","expert"];

/* ---------- Images ---------- */
const W = [["chat","🐱","le"],["chien","🐶","le"],["lion","🦁","le"],["éléphant","🐘","l'"],["girafe","🦒","la"],["singe","🐒","le"],["poisson","🐟","le"],["oiseau","🐦","l'"],["vache","🐄","la"],["poule","🐔","la"],["cheval","🐴","le"],["mouton","🐑","le"],["cochon","🐷","le"],["lapin","🐰","le"],["tortue","🐢","la"],["zèbre","🦓","le"],["papillon","🦋","le"],["abeille","🐝","l'"],
  ["banane","🍌","la"],["pomme","🍎","la"],["ananas","🍍","l'"],["mangue","🥭","la"],["raisin","🍇","le"],["fraise","🍓","la"],["citron","🍋","le"],["avocat","🥑","l'"],
  ["ballon","⚽","le"],["maison","🏠","la"],["voiture","🚗","la"],["avion","✈️","l'"],["bateau","⛵","le"],["livre","📖","le"],["soleil","☀️","le"],["lune","🌙","la"],["arbre","🌳","l'"],["fleur","🌸","la"],["vélo","🚲","le"],["train","🚆","le"],["tambour","🥁","le"],["gâteau","🎂","le"]].map(([w, e, a]) => ({w, e, a}));
const W_CAT = [W.slice(0, 18), W.slice(18, 26), W.slice(26), W, W];
const nm = x => x.a.endsWith("'") ? x.a + x.w : x.a + " " + x.w;
const baseLetter = ch => ch.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();
const COLORS = [["rouge","#e53935"],["bleu","#1e6fd9"],["jaune","#f5c518"],["vert","#2e9e57"],["orange","#f57c00"],["violet","#8e44ad"]];
const svgShape = (inner, fill) => `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="${fill}" stroke="currentColor" stroke-width="3">${inner}</g></svg>`;
const SHAPES = {
  "le cercle":'<circle cx="50" cy="50" r="38"/>', "le carré":'<rect x="14" y="14" width="72" height="72" rx="4"/>',
  "le triangle":'<polygon points="50,10 92,86 8,86"/>', "l'étoile":'<polygon points="50,6 61,38 95,38 67,58 78,92 50,71 22,92 33,58 5,38 39,38"/>',
  "le cœur":'<path d="M50 88C20 66 6 48 6 32 6 18 17 8 30 8c10 0 17 6 20 14 3-8 10-14 20-14 13 0 24 10 24 24 0 16-14 34-44 56z"/>',

function polygon(n){ const p = times(n, i => { const a = -Math.PI/2 + i*2*Math.PI/n; return `${(50 + 42*Math.cos(a)).toFixed(1)},${(52 + 42*Math.sin(a)).toFixed(1)}`; }).join(" "); return `<polygon points="${p}"/>`; }
function pie(k, n){

function rectSvg(L, l, unit = "cm"){

}
const emojiRow = (e, n) => times(n, () => `<span>${e}</span>`).join("");

/* ================== FRANÇAIS ================== */
const VB = {
  manger:{e:"🍽️", pres:["mange","manges","mange","mangeons","mangez","mangent"], fut:"manger", imp:"mange", pp:"mangé", aux:"avoir"},
  finir:{e:"🏁", pres:["finis","finis","finit","finissons","finissez","finissent"], fut:"finir", imp:"finiss", pp:"fini", aux:"avoir"},
  être:{e:"🙂", pres:["suis","es","est","sommes","êtes","sont"], fut:"ser", imp:"ét", pp:"été", aux:"avoir"},
  avoir:{e:"🎁", pres:["ai","as","a","avons","avez","ont"], fut:"aur", imp:"av", pp:"eu", aux:"avoir"},
  aller:{e:"🚶", pres:["vais","vas","va","allons","allez","vont"], fut:"ir", imp:"all", pp:"allé", aux:"être"},
  chanter:{e:"🎤", pres:["chante","chantes","chante","chantons","chantez","chantent"], fut:"chanter", imp:"chant", pp:"chanté", aux:"avoir"},
  jouer:{e:"⚽", pres:["joue","joues","joue","jouons","jouez","jouent"], fut:"jouer", imp:"jou", pp:"joué", aux:"avoir"},
  faire:{e:"🛠️", pres:["fais","fais","fait","faisons","faites","font"], fut:"fer", imp:"fais", pp:"fait", aux:"avoir"}
};
const PRON = ["je","tu","il","nous","vous","ils"];
const TENSES = {pres:{name:"présent", cue:"Aujourd'hui,"}, fut:{name:"futur", cue:"Demain,"}, imp:{name:"imparfait", cue:"Autrefois,"}, pc:{name:"passé composé", cue:"Hier,"}};
function conj(v, t, p){
  const V = VB[v];
  if (t === "pres") return V.pres[p];
  if (t === "fut") return V.fut + ["ai","as","a","ons","ez","ont"][p];
  if (t === "imp"){ const end = ["ais","ais","ait","ions","iez","aient"][p]; let st = V.imp; if (st.endsWith("ge") && end[0] === "i") st = st.slice(0, -1); return st + end; }
  const aux = V.aux === "être" ? VB["être"].pres[p] : VB.avoir.pres[p];
  return aux + " " + V.pp + (V.aux === "être" && p >= 3 ? "s" : "");
}
const elide = (p, form) => p === 0 ? (/^[aeiouéèêh]/i.test(form) ? "J'" + form : "Je " + form) : PRON[p].charAt(0).toUpperCase() + PRON[p].slice(1) + " " + form;
const pronLabel = p => p === 0 ? "Je (J')" : PRON[p].charAt(0).toUpperCase() + PRON[p].slice(1);
/* mode "person" : 3 formes du même temps ; mode "tense" : la même personne à 3 temps différents */
function conjQs(tenses, mode, verbs = Object.keys(VB)){
  return times(5, () => {
    const v = verbs[rnd(0, verbs.length - 1)], t = tenses[rnd(0, tenses.length - 1)], p = rnd(0, 5), good = conj(v, t, p);
    let others;
    if (mode === "person") others = pick([...new Set(times(6, k => conj(v, t, k)))].filter(f => f !== good), 2);
    else others = pick(Object.keys(TENSES).filter(x => x !== t).map(x => conj(v, x, p)).filter(f => f !== good), 2);
    const q = mode === "tense" ? `${TENSES[t].cue} ${pronLabel(p).toLowerCase()} ___ (${v})` : `${pronLabel(p)} ___ (${v}) · ${TENSES[t].name}`;
    return {q, say:`Conjugue le verbe ${v} au ${TENSES[t].name} avec ${PRON[p]}.`, visual:`<span>${VB[v].e}</span>`,
      opts:shuffle([good, ...others]).map(f => opt(f, {big:f, small:true, good:f === good})), ex:`${mode === "tense" ? TENSES[t].cue + " " : ""}${elide(p, good)}${mode === "tense" ? "" : "."} (${TENSES[t].name})`};
  });
}
const PLURIELS = [["un cheval","des chevaux","des chevals"],["un journal","des journaux","des journals"],["un animal","des animaux","des animals"],["un bijou","des bijoux","des bijous"],["un chou","des choux","des chous"],["un genou","des genoux","des genous"],["un travail","des travaux","des travails"],["un festival","des festivals","des festivaux"],["un chapeau","des chapeaux","des chapeaus"],["un feu","des feux","des feus"],["un pneu","des pneus","des pneux"],["un nez","des nez","des nezs"],["un prix","des prix","des prixs"],["un œil","des yeux","des œils"],["un bateau","des bateaux","des bateaus"],["un clou","des clous","des cloux"]];
const HOMO = [
  ["Il ___ un chien.", "a", ["à","as"]], ["Je vais ___ Kinshasa.", "à", ["a","as"]], ["Le ciel ___ bleu.", "est", ["et","ai"]],
  ["Papa ___ maman sont là.", "et", ["est","es"]], ["Ils ___ partis à l'école.", "sont", ["son","sons"]], ["Il range ___ cahier.", "son", ["sont","sons"]],

  ["___ habites-tu ?", "Où", ["Ou","Houx"]], ["Les élèves ___ leurs cahiers.", "ont", ["on","onts"]], ["___ joue au ballon.", "On", ["Ont","Om"]],
  ["Il y a ___ d'élèves dans la classe.", "peu", ["peut","peux"]], ["Il ___ venir demain.", "peut", ["peu","peux"]]

const FONCTIONS = [["[Le chien] aboie.","Sujet"],["Marie mange [une mangue].","Complément d'objet direct"],["Il parle [à son ami].","Complément d'objet indirect"],
  ["Nous jouons [dans la cour].","Complément circonstanciel de lieu"],["[Demain], nous irons au marché.","Complément circonstanciel de temps"],["Le fleuve est [immense].","Attribut du sujet"],
  ["[Les enfants] chantent.","Sujet"],["Je lis [un livre].","Complément d'objet direct"],["Elle pense [à ses vacances].","Complément d'objet indirect"],["Il travaille [avec courage].","Complément circonstanciel de manière"]];
const FONCTION_LIST = ["Sujet","Complément d'objet direct","Complément d'objet indirect","Complément circonstanciel de lieu","Complément circonstanciel de temps","Complément circonstanciel de manière","Attribut du sujet"];

  ["Ses yeux brillent comme des étoiles.","Comparaison"],["La ville dort.","Personnification"],["Je meurs de faim !","Hyperbole"],["Le temps est un voleur.","Métaphore"],["Congo, ô mon Congo ! Congo de mes ancêtres !","Apostrophe"]];

/* ================== CALCUL ================== */
const CALCUL = (a, s) => times(5, i => {

/* ================== 20 NIVEAUX : 5 PALIERS DE 4 NIVEAUX ==================
   Niveau n -> palier p = ceil(n/4). Dans un palier, BOOST 0, 1, 2 agrandit les nombres ;
   le 4e niveau de chaque palier (4, 8, 12, 16, 20) est un défi de révision des paliers déjà vus. */
const MAX_LEVEL = 20;
const PALIERS = ["Débutant","Apprenti","Confirmé","Avancé","Champion"];
const palierOf = n => Math.ceil(n/4);
const isChallenge = n => n % 4 === 0;
function genLevel(subj, a, n){
  const S = SUBJECTS[subj], p = palierOf(n), sub = (n - 1) % 4;
  try {
    const ch = isChallenge(n), out = [], seen = new Set();
    BOOST = ch ? 2 : sub;
    for (let tries = 0; out.length < 5 && tries < 12; tries++){
      const batch = ch ? [S.gen(a, tries < 1 ? p : rnd(1, p))[rnd(0, 4)]] : S.gen(a, p);
      for (const q of batch){ const key = q.q + "|" + q.ex; if (out.length < 5 && !seen.has(key)){ seen.add(key); out.push(q); } }
    }
    while (out.length < 5) out.push(S.gen(a, p)[out.length]);
    return ch ? out : shuffle(out);
  } finally { BOOST = 0; }
}

  hw_intro:["Écrivez l'énoncé du devoir, ou prenez-le en photo. Vous recevez la solution pas à pas, une façon simple de l'expliquer à votre enfant et un exercice semblable. La réponse est rédigée dans la langue choisie en haut de la page.",

/* best[subj][step] = meilleures étoiles ; un niveau s'ouvre quand le précédent a au moins 1 étoile */
function childStats(c){
  const rows = (c.id === "guest" ? guestProgress() : app.progress).filter(p => p.child_id === c.id), best = {}, per = {};
  for (const p of rows){ const st = p.step || 1; best[p.subject] = best[p.subject] || {}; best[p.subject][st] = Math.max(best[p.subject][st] || 0, p.stars); }
  for (const k of Object.keys(SUBJECTS)){ const r = rows.filter(p => p.subject === k), b = best[k] || {};
    let reached = 0; for (let s = 1; s <= MAX_LEVEL; s++) if ((b[s] || 0) >= 1) reached = s;
    per[k] = {n:r.length, avg:r.length ? r.reduce((m, p) => m + p.score/p.total, 0)/r.length : 0, reached, best:b}; }
  return {rows, per, stars:rows.reduce((m, p) => m + p.stars, 0)};
}

/* ---------- Aide aux devoirs (pour les parents) ---------- */
let samplePromise = null;
const getSample = () => samplePromise || (samplePromise = (window.claude && typeof window.claude.use === "function") ? window.claude.use("sample").catch(() => null) : Promise.resolve(null));
function mdLite(src){
  const lines = esc(src).split("\n"), out = []; let list = null;
  const inline = x => x.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
  const close = () => { if (list){ out.push(`</${list}>`); list = null; } };
  for (const raw of lines){ const l = raw.trim(); let m;
    if (!l){ close(); continue; }
    if ((m = l.match(/^#{1,4}\s+(.*)/))){ close(); out.push(`<h3>${inline(m[1])}</h3>`); }
    else if ((m = l.match(/^(\d+)[.)]\s+(.*)/))){ if (list !== "ol"){ close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[2])}</li>`); }
    else if ((m = l.match(/^[-*•]\s+(.*)/))){ if (list !== "ul"){ close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); }
    else { close(); out.push(`<p>${inline(l)}</p>`); }
  }
  close(); return out.join("");
}
/* Calculatrice expliquée : fonctionne hors connexion */
function explainCalc(expr){
  const src = expr.replace(/\s+/g, "").replace(/[−–]/g, "-").replace(/[x×*]/g, "×").replace(/[:÷/]/g, "÷").replace(/,/g, ".");
  if (!/^[\d.+\-×÷()]+$/.test(src)) throw new Error(t("calc_err"));
  const steps = []; let e = src;
  const num = "(?:(?<![\\d.])-)?\\d+(?:\\.\\d+)?", nf = v => fr(Math.round(v*1e6)/1e6);
  const evalFlat = x => {
    let m; const md = new RegExp(`(${num})([×÷])(${num})`), as = new RegExp(`(${num})([+\\-])(${num})`);
    while ((m = x.match(md))){ const a = +m[1], b = +m[3]; if (m[2] === "÷" && b === 0) throw new Error(t("calc_zero")); const r = m[2] === "×" ? a*b : a/b;
      steps.push(t(m[2] === "×" ? "calc_mul" : "calc_div", {x:`${nf(a)} ${m[2]} ${nf(b)} = ${nf(r)}`})); x = x.replace(m[0], String(r)); }
    while (!/^-?\d+(\.\d+)?$/.test(x) && (m = x.match(as))){ const a = +m[1], b = +m[3], r = m[2] === "+" ? a + b : a - b;
      steps.push(t(m[2] === "+" ? "calc_add" : "calc_sub", {x:`${nf(a)} ${m[2] === "+" ? "+" : "−"} ${nf(b)} = ${nf(r)}`})); x = x.replace(m[0], String(r)); }
    return x;
  };
  let m, guard = 0;
  while ((m = e.match(/\(([^()]*)\)/)) && guard++ < 50){ steps.push(t("calc_paren", {x:m[1].replace(/-/g, " − ").replace(/([+×÷])/g, " $1 ")})); e = e.replace(m[0], evalFlat(m[1])); }
  if (/[()]/.test(e)) throw new Error(t("calc_paren_err"));
  const res = +evalFlat(e); if (!isFinite(res)) throw new Error(t("calc_err"));
  return {steps, res:nf(res)};
}

const ARROW = `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M24 4h16v30h14L32 60 10 34h14z" fill="var(--pointer)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>`;
function runActivity(c, subj, step){
  app.rerender = () => showSteps(c, subj);
  const a = ageIdx(c.level), S = SUBJECTS[subj], qs = genLevel(subj, a, step), speakAuto = a <= 1 || subj === "anglais";
  const res = []; let i = 0, tries = 0, helped = false, t0 = Date.now(), tick = null;
  const view = $("#view");
  function draw(){
    const q = qs[i]; tries = 0; helped = false;
    view.innerHTML = `<section class="act" style="--c:${S.c}">
      <div class="act-top">
        <button class="btn ghost" id="q-back">${t("back_levels")}</button>
        <div class="dots" aria-label="${i + 1}/${qs.length}">${qs.map((_, k) => `<i class="${k < res.length ? (res[k] ? "ok" : "ko") : k === i ? "cur" : ""}"></i>`).join("")}</div>
        <div class="row">${subj === "mental" ? `<span class="chrono" id="chrono">⏱️ 0 s</span>` : ""}<button class="btn ghost" id="q-help">💡 ${t("help")}</button><button class="btn ghost" id="q-voice" aria-pressed="${app.voice}">${app.voice ? "🗣️" : "🤐"} ${t("voice")}</button></div>
      </div>
      <div class="qcard"><span class="eyebrow">${S.ico} ${tS(subj)} · ${t("level")} ${step}/${MAX_LEVEL}${isChallenge(step) ? " · " + t("challenge") : ""}</span><p class="qtext" lang="${q.lang === "en" ? "en" : "fr"}" dir="ltr">${esc(q.q)}</p>${q.visual ? `<div class="visual" dir="ltr">${q.visual}</div>` : ""}<button class="btn" id="q-say">🔊 ${t("listen")}</button></div>
      <div class="opts ${q.opts.some(o => !o.hideLabel && String(o.t).length > 16) ? "long" : ""}" dir="ltr">${q.opts.map((o, k) => `<button class="opt" data-k="${k}" aria-label="${esc(o.t)}">${o.img ? `<span class="im" aria-hidden="true">${o.img}</span>` : ""}${o.svg || ""}${o.big ? `<span class="big" style="${o.small ? "font-size:clamp(17px,2.8vw,26px)" : ""}">${esc(o.big)}</span>` : ""}${o.sub ? `<span class="muted" aria-hidden="true">${o.sub}</span>` : ""}${!o.big && !o.hideLabel ? `<span>${esc(o.t)}</span>` : ""}</button>`).join("")}</div>
      <p class="feedback" id="fb"></p>
      <div class="pointer" id="ptr" hidden>${ARROW}</div>
    </section>`;
    $("#q-back").onclick = () => { clearInterval(tick); showSteps(c, subj); };
    $("#q-say").onclick = () => speak(q.say, true, q.lang || "fr");
    $("#q-voice").onclick = () => { app.voice = !app.voice; $("#q-voice").textContent = (app.voice ? "🗣️ " : "🤐 ") + t("voice"); $("#q-voice").setAttribute("aria-pressed", app.voice); if (!app.voice) try { speechSynthesis.cancel(); } catch {} };
    $("#q-help").onclick = () => { helped = true; point(); $("#fb").textContent = t("look_arrow"); $("#fb").className = "feedback"; speak(t("look_arrow"), false, LANG); };
    view.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b));
    if (subj === "mental"){ clearInterval(tick); tick = setInterval(() => { const el = $("#chrono"); if (el) el.textContent = `⏱️ ${Math.round((Date.now() - t0)/1000)} s`; else clearInterval(tick); }, 500); }
    if (speakAuto) speak(q.say, false, q.lang || "fr");
  }
  function point(){
    const k = qs[i].opts.findIndex(o => o.good), tg = view.querySelector(`.opt[data-k="${k}"]`), act = view.querySelector(".act"), p = $("#ptr");
    const r = tg.getBoundingClientRect(), ar = act.getBoundingClientRect();
    p.style.left = (r.left - ar.left + r.width/2 - 28) + "px"; p.style.top = (r.top - ar.top - 50) + "px"; p.hidden = false;
  }
  function answer(b){
    const q = qs[i], o = q.opts[+b.dataset.k], fb = $("#fb");
    if (b.disabled) return;
    if (o.good){
      const ok = tries === 0 && !helped; res.push(ok);
      view.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x !== b) x.classList.add("dim"); });
      b.classList.add("good"); $("#ptr").hidden = true;
      fb.innerHTML = `${esc(ok ? t("bravo") : t("thats_it"))} <span lang="fr">${esc(q.ex)}</span>`; fb.className = "feedback ok"; sfx(true); speak(ok ? t("bravo") : t("thats_it"), false, LANG);
      setTimeout(() => { i++; i < qs.length ? draw() : finish(); }, 1800);
    } else {
      tries++; b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); b.disabled = true; b.classList.add("dim");
      fb.textContent = tries >= 2 ? t("arrow_shows") : t("not_quite"); fb.className = "feedback err"; sfx(false);
      if (tries >= 2){ point(); speak(t("look_arrow"), false, LANG); }
    }
  }
  async function finish(){
    clearInterval(tick);
    const score = res.filter(Boolean).length, stars = score === 5 ? 3 : score === 4 ? 2 : score === 3 ? 1 : 0, secs = Math.round((Date.now() - t0)/1000), nm1 = esc(c.first_name);
    view.innerHTML = `<section class="panel endcard" style="--c:${S.c}">
      <span class="eyebrow">${S.ico} ${tS(subj)} · ${t("level")} ${step}/${MAX_LEVEL} · ${t("p" + palierOf(step))}</span>
      ${starsHtml(stars)}
      <p class="score" dir="ltr">${score} / ${qs.length}</p>
      ${subj === "mental" ? `<p class="chrono">⏱️ ${t("time", {s:secs})}</p>` : ""}
      <p style="font-size:20px">${stars === 3 ? t("perfect", {name:nm1}) : stars >= 1 ? t("well_done", {name:nm1}) : t("keep_going", {name:nm1})}</p>
      ${stars >= 1 && step < MAX_LEVEL ? `<p class="note ok">${t("unlocked", {n:step + 1})}</p>` : stars >= 1 ? `<p class="note ok">${t("all_done", {subj:tS(subj)})}</p>` : `<p class="note">${t("need3")}</p>`}
      <p class="muted" id="save-msg">${t("saving")}</p>
      <div class="row" style="justify-content:center">${stars >= 1 && step < MAX_LEVEL ? `<button class="btn primary" id="e-next">${t("next", {n:step + 1})}</button>` : ""}<button class="btn" id="e-again">${t("replay")}</button><button class="btn ghost" id="e-home">${t("other_subject")}</button></div>
    </section>`;
    speak(stars === 3 ? t("say_perfect") : stars >= 1 ? t("say_well") : t("say_keep"), false, LANG);
    $("#e-again").onclick = () => runActivity(c, subj, step); $("#e-home").onclick = () => showChild(c);
    const nx = $("#e-next"); if (nx) nx.onclick = () => runActivity(c, subj, step + 1);
    if (c.id === "guest"){ guestData().progress.unshift({child_id:"guest", subject:subj, level:c.level, step, score, total:qs.length, stars, created_at:new Date().toISOString()}); guestSave(); $("#save-msg").textContent = t("guest_saved"); }
    else try { await store.addProgress({child_id:c.id, subject:subj, level:c.level, step, activity:actLabel(subj, step), score, total:qs.length, stars}); app.progress = await store.progress(); $("#save-msg").textContent = t("saved"); }
    catch (e){ $("#save-msg").textContent = t("save_fail", {e:e.message}); }
  }
  draw();
}

/* ---------- Voix, sons et volume ----------
   La voix suit la langue demandée ; sans voix installée pour le lingala, le kikongo ou le tshiluba,
   la phrase est lue par la voix française (prononciation approchée). */
const voiceCache = {};
function pickVoice(code){
  if (code in voiceCache) return voiceCache[code];
  const L = LANGS.find(x => x.code === code), list = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const want = (L && L.tts) ? L.tts.toLowerCase().split("-")[0] : null;
  const v = want ? list.find(x => x.lang.toLowerCase().startsWith(want)) : null;
  return (voiceCache[code] = v ? {voice:v, lang:v.lang} : null);
}
function speak(text, force, lang){
  if ((!app.voice && !force) || app.volume === 0) return;
  try { const s = window.speechSynthesis; if (!s) return; s.cancel();
    const code = lang || "fr", got = pickVoice(code) || pickVoice("fr");
    const u = new SpeechSynthesisUtterance(text); u.lang = got ? got.lang : "fr-FR"; u.rate = .9; u.volume = app.volume; if (got) u.voice = got.voice; s.speak(u); } catch {}
}
try { if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { for (const k in voiceCache) delete voiceCache[k]; }; } catch {}
let actx = null;
function sfx(ok){
  if (app.volume === 0) return;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const t0 = actx.currentTime, peak = .2*app.volume;
    (ok ? [523, 659, 784] : [220, 196]).forEach((f, k) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = ok ? "triangle" : "sine";
      g.gain.setValueAtTime(.0001, t0 + k*.09); g.gain.exponentialRampToValueAtTime(Math.max(.0002, peak), t0 + k*.09 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + k*.09 + .25);
      o.connect(g); g.connect(actx.destination); o.start(t0 + k*.09); o.stop(t0 + k*.09 + .3); }); } catch {}
}
