}

  --ok:#4fcb92; --ok-soft:#173528; --warn:#f0b54d; --warn-soft:#3a3018; --err:#ff7f6c; --err-soft:#3e2420; --trial:#ab8cf2; --trial-soft:#2b2445; color-scheme:dark}}
:root[data-theme="dark"]{

let mem = null;

function demoPersist(){ mem = {settings:db.settings, clients:db.clients, subs:db.subs, pays:db.pays}; try { localStorage.setItem(DEMO_KEY, JSON.stringify(mem)); } catch {} }

const chk = ({data, error}) => { if (error) throw new Error(error.message); return data; };
async function loadAll(){
  if (!cloud){ const d = demoLoad(); Object.assign(db, d); return; }
  const [st, cl, su, pa] = await Promise.all([
    sb.from("crm_settings").select("*").eq("id", 1).single(), sb.from("crm_clients").select("*").order("created_at", {ascending:false}),

async function validatePayment(id, ok){
  if (cloud){ chk(await sb.rpc("crm_validate_payment", {p_id:id, p_ok:ok})); return loadAll(); }
  const p = db.pays.find(x => x.id === id); if (!p || p.status !== "a_verifier") throw new Error("DEJA_TRAITE");
  const s = db.subs.find(x => x.id === p.subscription_id), now = new Date().toISOString();
  if (!ok){ p.status = "rejete"; p.validated_at = now; if (s && s.status === "en_attente") s.status = "rejete"; return demoPersist(); }

function clientState(c){
  const subs = db.subs.filter(s => s.client_id === c.id);
  const live = subs.filter(s => ["actif","essai"].includes(effStatus(s))).sort((a, b) => new Date(b.ends_at) - new Date(a.ends_at));
  const act = live.find(s => effStatus(s) === "actif") || live[0];
  if (act) return {status:effStatus(act), cycle:act.cycle, ends:act.ends_at, sub:act};
  const pend = subs.find(s => s.status === "en_attente"); if (pend) return {status:"en_attente", cycle:pend.cycle, ends:null, sub:pend};
  const last = subs.filter(s => s.ends_at).sort((a, b) => new Date(b.ends_at) - new Date(a.ends_at))[0];
  if (last) return {status:"expire", cycle:last.cycle, ends:last.ends_at, sub:last};
  return {status:"aucun", cycle:null, ends:null, sub:null};
}
const clientById = id => db.clients.find(c => c.id === id) || {full_name:"(client supprimé)", phone:""};
function stats(){
  const states = db.clients.map(c => ({c, ...clientState(c)}));
  const active = states.filter(x => x.status === "actif"), trials = states.filter(x => x.status === "essai");
  const mrr = active.reduce((m, x) => m + (x.cycle === "annuel" ? (+x.sub.amount_usd)/12 : +x.sub.amount_usd), 0);
  const now = new Date(), months = [];
  for (let i = 5; i >= 0; i--){ const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({y:d.getFullYear(), m:d.getMonth(), label:d.toLocaleDateString("fr-FR", {month:"short"}), v:0}); }
  db.pays.filter(p => p.status === "valide" && p.validated_at).forEach(p => { const d = new Date(p.validated_at), b = months.find(x => x.y === d.getFullYear() && x.m === d.getMonth()); if (b) b.v += +p.amount_usd; });
  const toCheck = db.pays.filter(p => p.status === "a_verifier");
  const soon = states.filter(x => x.status === "actif" && x.ends && daysLeft(x.ends) <= 7);
  return {states, active, trials, mrr, months, toCheck, soon, monthRev:months[5].v};
}

    </form>
  </section>`;
  const hint = () => { const m = +$("#s-m").value, y = +$("#s-y").value; $("#s-save-hint").textContent = m && y ? `Remise annuelle : ${Math.round((1 - y/(m*12))*100)} % (économie de ${money(m*12 - y)})` : ""; };
  hint(); $("#s-m").oninput = hint; $("#s-y").oninput = hint;
  $("#sf").onsubmit = async e => { e.preventDefault(); const m = $("#s-msg");
    const v = {mpesa_number:$("#s-num").value.trim(), mpesa_name:$("#s-name").value.trim() || "Kelasi Kids", price_month:+$("#s-m").value, price_year:+$("#s-y").value, trial_days:Math.round(+$("#s-t").value)};
    if (!(v.price_month >= 0 && v.price_year >= 0) || !(v.trial_days >= 0 && v.trial_days <= 30)){ m.textContent = "Vérifiez les prix (positifs) et la durée de l'essai (0 à 30 jours)."; m.className = "note err"; m.hidden = false; return; }
    try { await saveSettings(v); m.textContent = "Réglages enregistrés."; m.className = "note ok"; m.hidden = false; } catch (err){ m.textContent = frErr(err.message); m.className = "note err"; m.hidden = false; } };
}

/* ================== CONNEXION ================== */
function showLogin(msg){
  $("#logout").hidden = true; $("#who").textContent = "";
  $("#view").innerHTML = `<section class="panel login">
    <h2>Accès administrateur</h2>
    ${cloud ? `<p class="muted" style="font-size:14px">Connectez-vous avec l'adresse e-mail autorisée. Première fois ? Créez votre accès, puis confirmez l'e-mail reçu.</p>
    <form id="lf" novalidate style="display:grid;gap:12px">
      <label class="f" for="l-e">Adresse e-mail<input class="inp" id="l-e" type="email" autocomplete="email" required></label>
      <label class="f" for="l-p">Mot de passe<input class="inp" id="l-p" type="password" autocomplete="current-password" minlength="8" required></label>
      <div class="row"><button class="btn primary" type="submit">Se connecter</button><button class="btn" type="button" id="l-up">Créer mon accès</button></div>
      <p id="l-m" ${msg ? "" : "hidden"} class="note err">${esc(msg || "")}</p>
    </form>` : `<p class="muted" style="font-size:14px">Cet aperçu ne peut pas joindre la base de données : il s'ouvre en démo avec des clients fictifs. Une fois le site hébergé, cette page demande votre e-mail et votre mot de passe.</p>
    <button class="btn primary" id="demo-in">Ouvrir la démo du CRM</button>`}
  </section>`;
  if (!cloud){ $("#demo-in").onclick = async () => { await loadAll(); $("#who").textContent = "Démo"; render(); }; return; }
  const say = (t, k) => { const m = $("#l-m"); m.textContent = t; m.className = "note " + k; m.hidden = false; };
  $("#lf").onsubmit = async e => { e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({email:$("#l-e").value.trim(), password:$("#l-p").value});
    if (error) return say(/Invalid login/i.test(error.message) ? "E-mail ou mot de passe incorrect." : /not confirmed/i.test(error.message) ? "Confirmez d'abord votre adresse grâce au lien reçu par e-mail." : error.message, "err");
    enter(); };
  $("#l-up").onclick = async () => { const email = $("#l-e").value.trim(), password = $("#l-p").value;
    if (!/^\S+@\S+\.\S+$/.test(email) || password.length < 8) return say("Saisissez votre e-mail et un mot de passe d'au moins 8 caractères.", "err");
    const { error } = await sb.auth.signUp({email, password, options:{data:{display_name:"Administrateur CRM"}, emailRedirectTo:location.href}});
    if (error) return say(/already registered/i.test(error.message) ? "Ce compte existe déjà : connectez-vous." : error.message, "err");
    say("Compte créé. Ouvrez le lien reçu par e-mail pour le confirmer, puis connectez-vous.", "ok"); };
}
async function enter(){
  const { data } = await sb.auth.getUser(); const user = data && data.user;
  if (!user) return showLogin();
  const { data: ok } = await sb.rpc("crm_is_admin");
  if (!ok){ await sb.auth.signOut(); return showLogin("Ce compte n'a pas accès au CRM. Utilisez l'adresse e-mail autorisée."); }
  $("#who").textContent = user.email; $("#logout").hidden = false;
  try { await loadAll(); render(); } catch (e){ $("#view").innerHTML = `<p class="note err">Les données n'ont pas pu être chargées : ${esc(e.message)}</p>`; }
}
$("#logout").onclick = async () => { if (sb) await sb.auth.signOut(); showLogin(); };

(async function boot(){
  try {
    if (window.supabase){ const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 3500);
      const r = await fetch(SB_URL + "/auth/v1/health", {headers:{apikey:SB_KEY}, signal:ctl.signal}); clearTimeout(tm); cloud = r.ok; }
  } catch { cloud = false; }
  const b = $("#mode-badge"); b.textContent = cloud ? "En ligne" : "Démo"; b.className = "badge" + (cloud ? " on" : "");
  if (cloud){ sb = window.supabase.createClient(SB_URL, SB_KEY); const { data } = await sb.auth.getSession(); if (data.session) return enter(); }
  showLogin();
})();
</script>
