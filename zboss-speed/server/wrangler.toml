# 2 Life : serveur du jeu sur Cloudflare (offre gratuite)
# Déploiement : npx wrangler d1 create two-life  -> recopier database_id ci-dessous
#               npx wrangler d1 execute two-life --remote --file=schema.sql
#               npx wrangler deploy
name = "two-life-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# adresses autorisées à appeler l'API, séparées par des virgules ("*" = toutes)
ALLOWED_ORIGINS = "*"
# e-mails des administrateurs (séparés par des virgules) : ils accèdent à admin.html.
# Le dépôt est public : ne pas écrire l'adresse ici. La mettre dans le tableau de bord Cloudflare
# (Worker > Settings > Variables, nom ADMIN_EMAILS) ou, en local, dans server/.dev.vars (ignoré par git).
ADMIN_EMAILS = ""

[[d1_databases]]
binding = "DB"
database_name = "two-life"
database_id = "00000000-0000-0000-0000-000000000000"

# consignes du jour : appliquées toutes les 15 minutes, même quand le joueur n'est pas connecté
[triggers]
crons = ["*/15 * * * *"]
