# 2 Life : serveur du jeu sur Cloudflare (offre gratuite)
# Déploiement : voir DEPLOIEMENT.md (base D1 « two-life », puis Workers Builds relié au dépôt GitHub,
# dossier zboss-speed/server, commande de déploiement : npm run deploy)
name = "two-life"
# adresse publique two-life.<compte>.workers.dev toujours active après chaque déploiement
workers_dev = true
main = "src/index.js"
compatibility_date = "2025-06-01"
# garde les variables saisies dans le tableau de bord Cloudflare (ADMIN_EMAILS) à chaque déploiement
keep_vars = true

# le même Worker sert le site (vie.html, admin.html, la ville en 3D...) et l'API du jeu
[assets]
directory = "../"
run_worker_first = ["/api/*", "/config.js"]

[vars]
# adresses autorisées à appeler l'API, séparées par des virgules ("*" = toutes)
ALLOWED_ORIGINS = "*"
# e-mails des administrateurs (séparés par des virgules) : ils accèdent à admin.html.
# Le dépôt est public : ne pas écrire l'adresse ici. La mettre dans le tableau de bord Cloudflare
# (Worker > Settings > Variables and Secrets, nom ADMIN_EMAILS) ou, en local, dans server/.dev.vars (ignoré par git).
# notifications sur le téléphone : les clés VAPID sont créées toutes seules au premier usage et gardées
# dans la base. (Facultatif : VAPID_PUBLIC + secret VAPID_PRIVATE_JWK, voir scripts/vapid.mjs.)

[[d1_databases]]
binding = "DB"
database_name = "two-life"
database_id = "1d1ae2a3-c8e7-467d-917a-80e4da9d7c55"

# ville en direct : position des vrais joueurs dans la ville 3D (en mémoire, rien dans la base)
[[durable_objects.bindings]]
name = "CITY"
class_name = "CityRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CityRoom"]

# consignes du jour : appliquées toutes les 15 minutes, même quand le joueur n'est pas connecté
[triggers]
crons = ["*/15 * * * *"]
